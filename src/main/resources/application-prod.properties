# CANLI (PRODUCTION) PROFİLİ - git'e gönderilir, gizli bilgi İÇERMEZ.
# Etkinleştirme:  SPRING_PROFILES_ACTIVE=prod
#
# Gizli değerler ortam değişkenleriyle verilir, dosyaya yazılmaz:
#   MHRS_DB_URL, MHRS_DB_USERNAME, MHRS_DB_PASSWORD
#   MHRS_JWT_SECRET        (zorunlu - yoksa uygulama açılmaz)
#   MHRS_MAIL_USERNAME, MHRS_MAIL_PASSWORD
#   MHRS_CORS_ORIGINS      (örn. https://mhrs-randevu.vercel.app)

# Şema normalde uygulama tarafından DEĞİŞTİRİLMEZ, yalnızca doğrulanır.
# Geliştirmedeki "update" canlı veritabanında sütun/tablo değiştirebilirdi.
#
# İLK DAĞITIM İSTİSNASI: Yepyeni ve boş bir veritabanında "validate" başarısız olur
# ("missing table [appointments]"), çünkü doğrulayacak tablo yoktur. Bu yüzden değer
# dışarıdan verilebilir. İlk açılışta bir kez:
#     MHRS_DDL_AUTO=update
# tablolar oluştuktan sonra bu değişken KALDIRILIR ve varsayılan "validate"e dönülür.
spring.jpa.hibernate.ddl-auto=${MHRS_DDL_AUTO:validate}

# Örnek veri YÜKLENMEZ: demo profili kapalı olduğu için data-locations boştur.
# schema.sql yine çalışır (indeksler ve sütun göçleri canlıda da gereklidir).
spring.sql.init.mode=always

# Canlıda SQL günlüğü kapalı: başarım ve gürültü nedeniyle.
spring.jpa.show-sql=false
spring.jackson.serialization.indent_output=false

# Hata sayfalarında iç yapı sızmasın
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
