spring.application.name=merkezi-randevu-sistemi

# GİZLİ BİLGİLER BU DOSYADA TUTULMAZ
# Veritabanı şifresi, JWT anahtarı ve e-posta şifresi gibi değerler aşağıda
# ${...} yer tutucularıyla yazılmıştır. Gerçek değerler, git'e GÖNDERİLMEYEN
# application-local.properties dosyasındadır (bkz. .gitignore).
# Aşağıdaki "local" profili o dosyayı otomatik olarak yükler; Eclipse'te ek ayar gerekmez.
# Varsayılan: geliştirme. "local" gizli değerleri, "demo" örnek verileri yükler.
# CANLI ORTAMDA env değişkeniyle ezilir:  SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local,demo}
spring.datasource.url=${MHRS_DB_URL:jdbc:postgresql://localhost:5432/mhrs_db?useUnicode=yes&characterEncoding=UTF-8}
spring.datasource.username=${MHRS_DB_USERNAME:postgres}
spring.datasource.password=${MHRS_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.jackson.serialization.indent_output=true
server.port=${PORT:8081}
spring.sql.init.mode=always
# schema.sql HER ortamda çalışır: kısmi tekil indeksleri ve sütun göçlerini içerir.
# Örnek veri (demo-data.sql) burada YOKTUR; yalnızca "demo" profilinde yüklenir.
# Sebep: demo-data.sql herkese açık depoda duran bir ADMIN hesabı açar.
spring.sql.init.schema-locations=classpath:schema.sql
# schema.sql, Hibernate tabloları oluşturduktan/güncelledikten SONRA çalışsın
# (yoksa schema.sql'deki index'ler henüz var olmayan tabloya eklenmeye çalışılır)
spring.jpa.defer-datasource-initialization=true

# JWT (rol tabanlı yetkilendirme için)
# DİKKAT: Bilerek VARSAYILAN DEĞER VERİLMEMİŞTİR.
# Varsayılan bırakılsaydı, canlıda env değişkeni unutulduğunda uygulama sessizce
# depoda yazılı olan anahtarla çalışır ve herkes istediği rol için token üretebilirdi.
# Değer yoksa uygulama AÇILMAZ - sessiz güvenlik açığı yerine gürültülü hata tercih edilir.
# Geliştirmede değer application-local.properties dosyasından gelir.
mhrs.jwt.secret=${MHRS_JWT_SECRET}
mhrs.jwt.expiration-ms=86400000

# CORS: tarayıcıdan hangi adreslerin API'ye erişebileceği.
# Geliştirme varsayılanı yerel makineyi ve aynı ağdaki telefonu kapsar.
# Canlıda yalnızca kendi alan adın yazılmalıdır (örn. https://mhrs-randevu.vercel.app).
mhrs.cors.izinli-kaynaklar=${MHRS_CORS_ORIGINS:http://localhost:3000,http://192.168.*.*:3000}

# E-posta bildirimleri (gerçek Gmail SMTP — Uygulama Şifresi ile)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MHRS_MAIL_USERNAME:}
spring.mail.password=${MHRS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Randevu optimizasyon motoru — ağırlıklar toplamı 1.0 olacak şekilde ayarlanır.
# Tez kapsamında duyarlılık analizi için bu değerler değiştirilebilir.
mhrs.optimizasyon.bekleme-agirligi=0.40
mhrs.optimizasyon.doluluk-agirligi=0.25
mhrs.optimizasyon.varyans-agirligi=0.15
mhrs.optimizasyon.risk-agirligi=0.20
# Hedef doluluk %100 DEĞİLDİR: mola, gecikme ve acil hasta için pay bırakılır
mhrs.optimizasyon.hedef-doluluk=0.85
mhrs.optimizasyon.asiri-yuk-cezasi=2.0
mhrs.optimizasyon.oneri-sayisi=3

# Bağlam farkındalı klinik erişim politikası (ABAC)
# Doktor, hastanın klinik verisine yalnızca tedavi ilişkisi varsa, mesai içindeyse
# ve o gün görevdeyse erişebilir. Acil erişim gerekçe bildirilerek aşılabilir;
# her aşım denetim kaydına ayrıca yazılır.
mhrs.klinik-erisim.mesai-baslangic=08:00
mhrs.klinik-erisim.mesai-bitis=18:00
mhrs.klinik-erisim.iliski-gecmis-gun=90
mhrs.klinik-erisim.iliski-gelecek-gun=30
mhrs.klinik-erisim.acil-erisim-acik=true
mhrs.klinik-erisim.acil-gerekce-min-uzunluk=10
