spring.application.name=merkezi-randevu-sistemi

# GİZLİ BİLGİLER BU DOSYADA TUTULMAZ
# Veritabanı şifresi, JWT anahtarı ve e-posta şifresi gibi değerler aşağıda
# ${...} yer tutucularıyla yazılmıştır. Gerçek değerler, git'e GÖNDERİLMEYEN
# application-local.properties dosyasındadır (bkz. .gitignore).
# Aşağıdaki "local" profili o dosyayı otomatik olarak yükler; Eclipse'te ek ayar gerekmez.
spring.profiles.active=local
spring.datasource.url=jdbc:postgresql://localhost:5432/mhrs_db?useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=postgres
spring.datasource.password=${MHRS_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.jackson.serialization.indent_output=true
server.port=8081
spring.sql.init.mode=always
# schema.sql/data.sql, Hibernate tabloları oluşturduktan/güncelledikten SONRA çalışsın
# (yoksa schema.sql'deki index'ler henüz var olmayan tabloya eklenmeye çalışılır)
spring.jpa.defer-datasource-initialization=true

# JWT (rol tabanlı yetkilendirme için)
mhrs.jwt.secret=${MHRS_JWT_SECRET:yerel-gelistirme-icin-varsayilan-imzalama-anahtari-32byte}
mhrs.jwt.expiration-ms=86400000

# E-posta bildirimleri (gerçek Gmail SMTP — Uygulama Şifresi ile)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MHRS_MAIL_USERNAME:}
spring.mail.password=${MHRS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
